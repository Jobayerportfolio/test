<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4EBE7">
<title>Link Up – a calm connection game</title>
<meta name="description" content="Link Up is a slow, calm puzzle game. Join drifting dots into one network. No ads, no pressure.">
<meta property="og:title" content="Link Up"><meta property="og:description" content="A slow game about connection. Join every dot into one network."><meta property="og:type" content="website">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4EBE7;--bg2:#D6E0DB;--ink:#26332F;--dim:#5E6F69;--d0:#5F8577;--d1:#55738F;--d2:#8C7AA6;--d3:#7C8A86;--ok:#3F6B5E;--warn:#A98040;--bad:#A8585A;
  --card:rgba(244,248,246,.84);--edge:rgba(38,51,47,.14);--f:'Lexend',system-ui,sans-serif;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
.dark{--bg:#141A1D;--bg2:#1C2528;--ink:#DCE5E1;--dim:#8FA19B;--d0:#8FB5A6;--d1:#86A5C4;--d2:#B5A4D0;--d3:#A3B0AB;--ok:#8FB5A6;--warn:#D1AD73;--bad:#CF8587;--card:rgba(28,37,40,.88);--edge:rgba(220,229,225,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font:300 1rem/1.55 var(--f);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ok);outline-offset:3px;border-radius:12px}
.hud{position:fixed;left:0;right:0;top:calc(var(--top) + 12px);display:flex;gap:8px;padding:0 14px;pointer-events:none;z-index:5;justify-content:center}
.pill{flex:1;max-width:480px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border:1px solid var(--edge);border-radius:16px}
#lv{font-weight:400;white-space:nowrap}
.bar{flex:1;height:4px;border-radius:2px;background:var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transform-origin:left;transition:background .6s}
.bar.low i{background:var(--warn)}
#tm{font-weight:400;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.calm .bar,.calm #tm{display:none}
.tools{display:flex;gap:8px;pointer-events:auto}
.ib{width:46px;height:46px;display:grid;place-items:center;background:var(--card);border:1px solid var(--edge);border-radius:14px}
.ib svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.status{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 22px);text-align:center;color:var(--dim);pointer-events:none;z-index:5;padding:0 20px}
.status b{color:var(--ink);font-weight:500}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(228,235,231,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:auto}
.dark .ov{background:rgba(20,26,29,.6)}
.ov[hidden]{display:none}
.card{width:min(430px,100%);padding:30px 26px;background:var(--card);border:1px solid var(--edge);border-radius:24px;animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-weight:300;font-size:clamp(2.4rem,11vw,3.2rem);line-height:1;letter-spacing:-.04em;margin-bottom:10px}
h2{font-weight:400;font-size:1.6rem;line-height:1.2;letter-spacing:-.02em;margin-bottom:8px}
.card p{color:var(--dim)}
.list{display:grid;gap:10px;margin-top:22px}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:14px 18px;text-align:left;border:1px solid var(--edge);border-radius:16px;transition:border-color .3s,background .3s}
.row:hover{border-color:var(--ok);background:rgba(95,133,119,.08)}
.row b{font-weight:500}.row span{color:var(--dim);font-size:.92rem}
.foot{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.lnk{padding:10px 14px;color:var(--dim);border-radius:12px;font-size:.95rem;text-decoration:none}
.lnk:hover{color:var(--ink)}
.btns{display:grid;gap:10px;margin-top:22px}
.btn{padding:15px 22px;border-radius:14px;font-weight:400;font-size:1.02rem;border:1px solid var(--edge);transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--edge)}
.tg input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--edge);position:relative;cursor:pointer;transition:background .3s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .3s}
.tg input:checked{background:var(--ok)}.tg input:checked::after{transform:translateX(18px)}
.seg{display:flex;gap:6px;margin:16px 0 6px}
.seg button{flex:1;padding:9px;border:1px solid var(--edge);border-radius:12px;font-size:.92rem}
.seg button.on{background:var(--ok);color:var(--bg);border-color:var(--ok)}
ol.lb{list-style:none;padding:0;margin-top:12px;display:grid;gap:3px}
ol.lb li{display:grid;grid-template-columns:2.4ch 1fr auto;gap:14px;padding:9px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
ol.lb li.me{background:rgba(95,133,119,.14)}
ol.lb li i{font-style:normal;color:var(--dim)}
.note{font-size:.88rem;margin-top:12px}
input.nm{width:100%;margin-top:18px;padding:14px 16px;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:14px;user-select:text;-webkit-user-select:text}
.err{color:var(--bad);font-size:.9rem;margin-top:8px;min-height:1.3em}
.sl{width:100%;margin:2px 0 10px;accent-color:var(--ok)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stat div{padding:12px 14px;border:1px solid var(--edge);border-radius:14px}.stat b{display:block;font-weight:400;font-size:1.5rem}.stat span{color:var(--dim);font-size:.85rem}
.ms{list-style:none;padding:0;margin-top:14px;display:grid;gap:6px}.ms li{display:flex;gap:10px;color:var(--dim)}.ms li.on{color:var(--ink)}.ms li::before{content:"";width:10px;height:10px;margin-top:8px;border-radius:50%;border:1.5px solid var(--dim);flex:none}.ms li.on::before{background:var(--ok);border-color:var(--ok)}
.how{list-style:none;padding:0;margin-top:16px;display:grid;gap:10px}.how li{padding:12px 14px;border:1px solid var(--edge);border-radius:14px;font-size:.95rem}.how b{font-weight:500}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="img" aria-label="Game board. Drag between dots to link them. With a keyboard, use arrow keys to choose a dot and Enter to link."></canvas>
<div class="hud">
  <div class="pill"><span id="lv">Level 1</span><div class="bar" id="barw"><i id="bar"></i></div><b id="tm">60</b></div>
  <div class="tools">
    <button class="ib" id="hn" aria-label="Show a hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg></button>
    <button class="ib" id="tr" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3"/></svg></button>
    <button class="ib" id="pz" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
</div>
<div class="status" id="st" aria-live="polite"></div>
<div class="ov" id="ov"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
/* ===== Shared leaderboard (optional). Leave empty to keep scores on this device only. ===== */
const BACKEND = { url: "", key: "" };   /* Supabase project URL and anon key */
const BACK_URL = "./";

const $ = id => document.getElementById(id), cv = $("c"), ctx = cv.getContext("2d");
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) } catch (e) { return d } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
const set = Object.assign({ sound: true, music: true, haptic: false, theme: "auto", mv: .6, rm: false }, store.get("lu-set", {}));
const TYPES = { d: { r: 9, reach: 1, sp: 1, am: 1 }, a: { r: 14, reach: 1.35, sp: .6, am: .6 }, w: { r: 6, reach: .8, sp: 1.8, am: .7 }, s: { r: 9, reach: 1, sp: 0, am: 0 } };
let W, H, dpr, S, maxLen, reachMul = 1.3, area, C = {}, dots = [], links = [], ghosts = [], ripples = [], lv = 1, total = 60, left = 60, mode = "menu", game = "calm", clock = 0;
let hintPair = null, hintLeft = 3, amb = 0, drag = null, sel = null, kb = 0, kbFrom = null, ptr = { x: 0, y: 0 }, flash = 0, pulse = 0, tut = !store.get("lu-tut", false), hinted = false, playSecs = 0, nudged = false, msgT = 0, R = Math.random;
const reduce = () => set.rm || matchMedia("(prefers-reduced-motion:reduce)").matches, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dayId = () => new Date().toISOString().slice(0, 10);
const mk = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
const hash = s => { let h = 7; for (const c of s) h = Math.imul(h * 31 + c.charCodeAt(0), 2654435761); return h >>> 0 };

/* ===== Theme ===== */
function theme() {
  const dark = set.theme === "dark" || (set.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  const cs = getComputedStyle(document.documentElement);
  ["bg", "ink", "dim", "d0", "d1", "d2", "d3", "ok", "warn", "bad"].forEach(k => C[k] = cs.getPropertyValue("--" + k).trim());
  document.querySelector("meta[name=theme-color]").content = C.bg;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);

/* ===== Audio: synthesized sound effects and a generative calm soundtrack ===== */
const AU = { ac: null, on: false, ci: 0 }, PENT = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7, 1318.5, 1568];
const CHORDS = [[130.8, 196, 293.7, 329.6], [110, 164.8, 246.9, 261.6], [87.3, 130.8, 220, 329.6], [98, 146.8, 220, 246.9]], BELLS = [523.3, 587.3, 659.3, 784, 880, 1046.5];
function audio() {
  if (AU.ac) return AU.ac;
  try {
    const ac = AU.ac = new (window.AudioContext || window.webkitAudioContext)(), mix = g => { const n = ac.createGain(); n.gain.value = g; return n };
    AU.master = mix(.9); AU.master.connect(ac.destination); AU.sfx = mix(set.sound ? 1 : 0); AU.sfx.connect(AU.master); AU.mus = mix(0); AU.mus.connect(AU.master);
    const len = ac.sampleRate * 3, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5) }
    AU.rev = ac.createConvolver(); AU.rev.buffer = buf; AU.rev.connect(AU.master);
  } catch (e) { AU.ac = null }
  return AU.ac;
}
function voice(f, o = {}) {
  const ac = AU.ac; if (!ac) return; const { type = "sine", delay = 0, a = .01, d = .6, v = .06, bus = "sfx", cut = 3200, to = 0, wet = .35 } = o;
  const t = ac.currentTime + delay, osc = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(), w = ac.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t); if (to) osc.frequency.exponentialRampToValueAtTime(to, t + a + d);
  lp.type = "lowpass"; lp.frequency.value = cut;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  w.gain.value = wet; osc.connect(lp); lp.connect(g); g.connect(AU[bus]); g.connect(w); w.connect(AU.rev); osc.start(t); osc.stop(t + a + d + .05);
}
const sfx = {
  pick: i => { audio(); voice(PENT[i % 14] * 2, { type: "triangle", d: .18, v: .025 }) },
  add: (i, delay = 0) => { audio(); const f = PENT[i % 10]; voice(f, { delay, a: .005, d: .5, v: .05 }); voice(f * 2, { delay, d: .25, v: .012 }) },
  link: n => { audio(); const f = PENT[clamp(n, 0, 13)]; voice(f, { d: 1, v: .06, wet: .5 }); voice(f * 1.5, { delay: .09, d: .9, v: .035, wet: .5 }); voice(f * 3, { delay: .09, d: .35, v: .01 }) },
  snap: () => { audio(); voice(300, { to: 110, d: .7, v: .045, type: "triangle", cut: 900 }) },
  err: () => { audio(); voice(196, { type: "triangle", d: .22, v: .03, cut: 700 }); voice(185, { delay: .1, type: "triangle", d: .25, v: .025, cut: 700 }) },
  ui: () => { audio(); voice(660, { d: .14, v: .03 }) },
  win: () => { audio(); [0, 2, 4, 5, 7].forEach((k, i) => voice(PENT[k + 2], { delay: i * .16, d: 1.8, v: .05, wet: .6 })) },
  lose: () => { audio(); [440, 329.6, 261.6].forEach((f, i) => voice(f, { delay: i * .3, d: 1.4, v: .035, wet: .6, cut: 1500 })) }
};
function musicOn() {
  const ac = audio(); if (!ac || AU.on || !set.music) return; AU.on = true; AU.mus.gain.setTargetAtTime(.9 * set.mv, ac.currentTime, 2.5);
  const chord = () => { if (!AU.on) return; CHORDS[AU.ci++ % 4].forEach(f => { voice(f, { a: 3.5, d: 7, v: .04, bus: "mus", cut: 900, wet: .5 }); voice(f * 1.004, { type: "triangle", a: 3.5, d: 7, v: .018, bus: "mus", cut: 700, wet: .5 }) }); AU.t1 = setTimeout(chord, 8000) };
  const bell = () => { if (!AU.on) return; voice(BELLS[Math.floor(Math.random() * BELLS.length)], { a: .02, d: 3.5, v: .02, bus: "mus", cut: 2500, wet: .7 }); AU.t2 = setTimeout(bell, 2200 + Math.random() * 4200) };
  chord(); AU.t2 = setTimeout(bell, 3000);
}
function musicOff() { if (!AU.ac) return; AU.on = false; clearTimeout(AU.t1); clearTimeout(AU.t2); AU.mus.gain.setTargetAtTime(0, AU.ac.currentTime, .6) }
const unlock = () => { audio(); if (AU.ac && AU.ac.state === "suspended") AU.ac.resume(); musicOn() };
addEventListener("pointerdown", unlock, { once: true }); addEventListener("keydown", unlock, { once: true });
const buzz = ms => { if (set.haptic && navigator.vibrate) navigator.vibrate(ms) };

/* ===== Layout ===== */
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = clamp(Math.min(W, H) / 520, .7, 1.3);
  area = { x0: 30, x1: W - 30, y0: 104 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--top")) || 0), y1: H - 72 };
  maxLen = Math.min(330, Math.min(W, H) * .46) * (game === "calm" ? 1.12 : 1);
  dots.forEach(d => { d.hx = clamp(d.hx, area.x0 + d.amp, area.x1 - d.amp); d.hy = clamp(d.hy, area.y0 + d.amp, area.y1 - d.amp) });
}
addEventListener("resize", resize);

/* ===== Mathematical patterns ===== */
const TAU = 6.2832;
const FORMS = [
  ["Ring", n => Array.from({ length: n }, (_, i) => [Math.cos(TAU * i / n - 1.57), Math.sin(TAU * i / n - 1.57)])],
  ["Spiral", n => Array.from({ length: n }, (_, i) => { const r = Math.sqrt((i + .5) / n), t = i * 2.39996; return [r * Math.cos(t), r * Math.sin(t)] })],
  ["Grid", n => { const c = Math.ceil(Math.sqrt(n)), rw = Math.ceil(n / c); return Array.from({ length: n }, (_, i) => [c > 1 ? (i % c) / (c - 1) * 2 - 1 : 0, rw > 1 ? Math.floor(i / c) / (rw - 1) * 2 - 1 : 0]) }],
  ["Figure eight", n => Array.from({ length: n }, (_, i) => { const t = TAU * i / n; return [Math.cos(t), Math.sin(t) * Math.cos(t) * 2] })],
  ["Double ring", n => { const o = Math.ceil(n * .6); return Array.from({ length: n }, (_, i) => i < o ? [Math.cos(TAU * i / o), Math.sin(TAU * i / o)] : [.5 * Math.cos(TAU * (i - o) / (n - o) + .5), .5 * Math.sin(TAU * (i - o) / (n - o) + .5)]) }],
  ["Twin clusters", n => Array.from({ length: n }, (_, i) => { const k = i % 2 ? 1 : -1, j = Math.floor(i / 2), m = Math.ceil(n / 2), r = .4 * Math.sqrt((j + .5) / m), t = j * 2.39996; return [k * .55 + r * Math.cos(t), k * .45 + r * Math.sin(t)] })],
  ["Wave", n => Array.from({ length: n }, (_, i) => { const x = n > 1 ? i / (n - 1) * 2 - 1 : 0; return [x, .65 * Math.sin(x * 4.7)] })],
  ["Knot", n => Array.from({ length: n }, (_, i) => { const t = TAU * i / n; return [Math.sin(3 * t + .5), Math.sin(2 * t)] })],
  ["Scatter", n => { const p = [], md = 1.1 / Math.sqrt(n); for (let t = 0; p.length < n && t < 800; t++) { const q = [R() * 2 - 1, R() * 2 - 1]; if (p.every(z => Math.hypot(z[0] - q[0], z[1] - q[1]) > md * (t > 500 ? .5 : .85))) p.push(q) } while (p.length < n) p.push([R() * 2 - 1, R() * 2 - 1]); return p }]
];
const KINDS = ["o", "l", "e", "p", "s", "v"];
function pos(d, t) {
  const w = d.w * t + d.ph;
  switch (d.k) {
    case "o": return [d.hx + d.A * Math.cos(w), d.hy + d.A * Math.sin(w)];
    case "l": return [d.hx + d.A * Math.sin(d.a * w), d.hy + d.B * Math.sin(d.b * d.w * t)];
    case "e": return [d.hx + d.A * Math.sin(w), d.hy + d.B * .5 * Math.sin(2 * w)];
    case "p": return [d.hx + d.A * Math.sin(w) * Math.cos(d.th), d.hy + d.A * Math.sin(w) * Math.sin(d.th)];
    case "s": { const r = d.A * (.65 + .35 * Math.sin(.5 * d.w * t + d.ph)); return [d.hx + r * Math.cos(w), d.hy + r * Math.sin(w)] }
    default: return [d.hx + d.A * Math.sin(w), d.hy + d.B * Math.sin(.5 * d.w * t + 2 * d.ph)];
  }
}
const lim = (a, b) => maxLen * reachMul * (TYPES[a.t].reach + TYPES[b.t].reach) / 2;

/* Every pattern is checked: neighbours always stay in range, so a winning set of links always exists. */
function solvable(ds) {
  const p = ds.map((_, i) => i), f = x => p[x] === x ? x : (p[x] = f(p[x]));
  for (let i = 0; i < ds.length; i++) for (let j = i + 1; j < ds.length; j++)
    if (Math.hypot(ds[i].hx - ds[j].hx, ds[i].hy - ds[j].hy) + ds[i].amp + ds[j].amp <= .84 * lim(ds[i], ds[j])) p[f(i)] = f(j);
  return ds.every((_, i) => f(i) === f(0));
}

/* ===== Levels ===== */
function start(n, g) {
  if (g) game = g; lv = n; hintLeft = 3; hintPair = null; resize(); links = []; ghosts = []; ripples = []; drag = sel = kbFrom = null; kb = 0; clock = 0; hinted = n > 1 || !tut; nudged = false; msgT = 0;
  R = game === "daily" ? mk(hash(dayId()) + n * 7919) : Math.random;
  reachMul = 1.3 - Math.min(.3, (n - 1) * .04);
  const cap = clamp(Math.floor((area.x1 - area.x0) * (area.y1 - area.y0) / (4600 * S * S)), 8, 22), count = n === 1 ? 5 : Math.min(cap, Math.round(5 + (n - 1) * 1.7));
  const types = Array(count).fill("d"), idx = [...types.keys()].sort(() => R() - .5), special = [];
  if (n >= 3) special.push("a"); if (n >= 4) special.push("s"); if (n >= 5) for (let k = 0; k < Math.min(4, Math.floor((n - 3) / 2)); k++) special.push("w"); if (n >= 7) special.push("a"); if (n >= 10) special.push("s");
  special.slice(0, Math.floor(count / 2)).forEach((t, i) => types[idx[i]] = t);
  const fi = game === "daily" ? Math.floor(R() * FORMS.length) : (n - 1) % FORMS.length, form = FORMS[fi], pts = form[1](count);

  <li><b>Dots.</b> Circle: Drifter. Large ring: Anchor, reaches farther. Diamond: Wisp, quick with a short reach. Square: Sleeper, stays still.</li></ul>
  <div class="btns"><button class="btn p" id="hb">Got it</button></div>`, "hb"); $("hb").onclick = back || menu;
}
function progress(back) {
  const got = store.get("lu-ms", []);
  show(`<h2>Your progress</h2><div class="stat"><div><b>${ST.maxLv}</b><span>Best level cleared</span></div><div><b>${ST.cleared}</b><span>Levels cleared</span></div><div><b>${ST.links}</b><span>Links made</span></div><div><b>${Math.floor(ST.secs / 60)}</b><span>Minutes played</span></div></div>
  <ul class="ms">${MS.map(([n]) => `<li class="${got.includes(n) ? "on" : ""}">${n}</li>`).join("")}</ul><div class="btns"><button class="btn p" id="pb">Back</button></div>`, "pb"); $("pb").onclick = back || menu;
}
function win() {
  mode = "won"; sfx.win(); buzz(15); ST.cleared++; ST.maxLv = Math.max(ST.maxLv, lv); if (game === "calm") store.set("lu-calm", Math.max(store.get("lu-calm", 1), lv + 1)); saveST(); checkMs(); const t = (total - left).toFixed(0);
  setTimeout(() => { show(`<h2>Level ${lv} linked</h2><p>${game === "calm" ? LINES[lv % LINES.length] : `Finished in ${t} seconds.`}</p>
    <div class="btns"><button class="btn p" id="nx">Next level</button><button class="btn" id="mn">Main menu</button></div>`, "nx");
    $("nx").onclick = () => { sfx.ui(); start(lv + 1) }; $("mn").onclick = menu }, 1100);
}
function lose() {
  mode = "lost"; saveST(); const cleared = lv - 1, g = groups(), id = boardId(game), un = dots.length - g.size; sfx.lose();
  if (cleared > store.get("lu-best", 0)) store.set("lu-best", cleared);
  show(`<h2>Run ended</h2><p>You cleared <b>${cleared}</b> level${cleared === 1 ? "" : "s"}. ${un} dot${un === 1 ? "" : "s"} stayed unlinked.</p>
  <input class="nm" id="nm" maxlength="16" placeholder="Your name" aria-label="Your name" value="${(store.get("lu-name", "") + "").replace(/[<>"&]/g, "")}"><div class="err" id="er" role="alert"></div>
  <div class="btns"><button class="btn p" id="sv">Save score</button><button class="btn" id="sh">Share</button><button class="btn" id="pa">Play again</button><button class="btn" id="mn">Main menu</button></div>`, "nm");
  let saved = false;
  $("sv").onclick = async () => {
    const n = $("nm").value.trim().replace(/[<>]/g, "");
    if (!n) { $("er").textContent = "Enter a name first."; return }
    if (cleared < 1) { $("er").textContent = "Clear at least one level to save a score."; return }
    if (saved) return; saved = true; store.set("lu-name", n); $("sv").textContent = "Saving";
    await postScore(id, n, cleared); sfx.ui(); board(game === "daily" ? "daily" : "run", menu);
  };
  $("nm").oninput = () => $("er").textContent = "";
  $("sh").onclick = async () => { const txt = `I cleared ${cleared} levels in Link Up. Can you beat it?`; try { if (navigator.share) await navigator.share({ title: "Link Up", text: txt, url: location.href }); else { await navigator.clipboard.writeText(txt + " " + location.href); $("sh").textContent = "Copied" } } catch (e) {} };
  $("pa").onclick = () => start(1); $("mn").onclick = menu;
}
function pause() {
  if (mode !== "play") return; mode = "pause";
  show(`<h2>Paused</h2><p>Your network is waiting.</p><div class="btns"><button class="btn p" id="rs">Resume</button><button class="btn" id="rl">Restart level</button><button class="btn" id="bd">Leaderboard</button><button class="btn" id="st2">Settings</button><button class="btn" id="mn">Main menu</button></div>`, "rs");
  $("rs").onclick = resume; $("rl").onclick = () => start(lv); $("mn").onclick = menu;
  $("bd").onclick = () => board(game === "daily" ? "daily" : "run", pause2); $("st2").onclick = () => settings(pause2);
}
const pause2 = () => { mode = "play"; pause() };
$("pz").onclick = pause; $("hn").onclick = hint;
$("tr").onclick = () => { if (mode === "play") { mode = "pause"; board(game === "daily" ? "daily" : "run", pause2) } else if (mode === "menu") board("run", menu) };
document.addEventListener("visibilitychange", () => { if (document.hidden) { saveST(); pause(); if (AU.ac) AU.ac.suspend() } else if (AU.ac) AU.ac.resume() });
addEventListener("keydown", e => { if (e.key === "Escape") pause() });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
theme(); resize(); menu(); requestAnimationFrame(frame);
</script>
</body>
